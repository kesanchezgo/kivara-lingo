<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kivara e2e Netflix fixture</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      .watch-video {
        position: relative;
        width: 640px;
        height: 360px;
        margin: 0 auto;
      }
      video {
        width: 100%;
        height: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <!--
      A Netflix watch page in miniature: the `.watch-video` wrapper the mount
      gate looks for, on /watch/<id>, and a real fetch to an `nflxvideo.net`
      URL so the MAIN-world interceptor sees a TTML and publishes it on the
      bus. The TTML body (and its xml:lang) comes from the spec's route.
    -->
    <div class="watch-video">
      <video id="player" muted playsinline crossorigin="anonymous"></video>
    </div>

    <script>
      // Minimal player API stub: the shape the MAIN-world interceptor reads.
      // It records the subtitle switch Kivara asks for, so the e2e can assert
      // that the app changes the track itself instead of telling the user to.
      window.__kivaraSubtitleSwitch = [];
      window.__kivaraSubtitleTracks = [
        { trackId: 'T:es', bcp47: 'es', displayName: 'Español', trackType: 'PRIMARY', rawTrackType: 'SUBTITLES', isNoneTrack: false, isForcedNarrative: false },
        { trackId: 'T:en', bcp47: 'en', displayName: 'Inglés', trackType: 'ASSISTIVE', rawTrackType: 'CLOSEDCAPTIONS', isNoneTrack: false, isForcedNarrative: false },
        // Netflix always ships an "off" pseudo-track: our Off row is a name
        // for it, and turning the subtitles off means selecting it.
        { trackId: 'T:none', bcp47: '', displayName: 'Off', trackType: '', rawTrackType: 'NONE', isNoneTrack: true, isForcedNarrative: false },
      ];
      // Audio stubs (PR #172): the tray's own menu lists and switches these.
      // `__kivaraAudioSwitch` records HOW the switch arrived — a track OBJECT
      // (modern Cadmium) or its id — because both must work.
      window.__kivaraAudioSwitch = [];
      window.__kivaraAudioTracks = [
        { trackId: 'A:es', bcp47: 'es', displayName: 'Español', trackType: 'DUB', isNative: true, channels: '2.0' },
        { trackId: 'A:en', bcp47: 'en', displayName: 'English', trackType: 'DUB', isNative: false },
      ];
      let currentAudio = window.__kivaraAudioTracks[0];
      let currentSubtitle = window.__kivaraSubtitleTracks[0];
      const applyTrack = (arg, list, setter) => {
        const id = typeof arg === 'string' ? arg : arg && arg.trackId;
        const found = list.find((track) => track.trackId === id);
        // A string id is what the language path sends, an object the menu path:
        // both are honoured, exactly like a real build.
        if (found) setter(found);
        return id;
      };
      const session = {
        seek: () => {},
        setPlaybackRate: () => {},
        isPlaying: () => true,
        getCurrentVideoId: () => '80000002',
        getAudioTrackList: () => window.__kivaraAudioTracks,
        getAudioTrack: () => currentAudio,
        setAudioTrack: (arg) => {
          window.__kivaraAudioSwitch.push(typeof arg === 'string' ? arg : `object:${arg && arg.trackId}`);
          applyTrack(arg, window.__kivaraAudioTracks, (track) => { currentAudio = track; });
        },
        getTimedTextTrackList: () => window.__kivaraSubtitleTracks,
        getTimedTextTrack: () => currentSubtitle,
        setTimedTextTrack: (arg) => {
          window.__kivaraSubtitleSwitch.push(typeof arg === 'string' ? arg : arg && arg.trackId);
          applyTrack(arg, window.__kivaraSubtitleTracks, (track) => { currentSubtitle = track; });
        },
        getTimedTextVisibility: () => true,
        setTimedTextVisible: () => {},
      };
      window.netflix = {
        appContext: {
          state: {
            playerApp: {
              getAPI: () => ({
                videoPlayer: {
                  getAllPlayerSessionIds: () => ['session-1'],
                  getVideoPlayerBySessionId: () => session,
                  getPlayingSessionId: () => 'session-1',
                  getAllPlayerStates: () => [session],
                  getPlayerByIndex: () => session,
                },
              }),
            },
          },
        },
        falcorCache: window.netflix_falcor,
      };

      // A realistic slice of the Falcor cache (PR #172): two seasons of one
      // series plus a stranger's episode, so the extractor has to pick the
      // series of the video being played.
      const atom = (value) => ({ $type: 'atom', value });
      window.netflix_falcor = {
        videos: {
          '80000001': { summary: atom({ id: 80000001, type: 'episode', title: 'Chapter One', seasonId: 9001, seriesId: 7000, episodeNumber: 1, runtime: 2820 }) },
          '80000002': { summary: atom({ id: 80000002, type: 'episode', title: 'Chapter Two', seasonId: 9001, seriesId: 7000, episodeNumber: 2, runtime: 2940, synopsis: 'Una sinopsis para la segunda.' }) },
          '80000003': { summary: atom({ id: 80000003, type: 'episode', title: 'Chapter Three', seasonId: 9002, seriesId: 7000, episodeNumber: 1, runtime: 3300 }) },
          '99999999': { summary: atom({ id: 99999999, type: 'episode', title: 'Otra serie', seasonId: 8001, seriesId: 1234, episodeNumber: 1 }) },
        },
        seasons: {
          '9001': { summary: atom({ id: 9001, title: 'Temporada 1', seq: 1 }) },
          '9002': { summary: atom({ id: 9002, title: 'Temporada 2', seq: 2 }) },
        },
      };

      // `window.netflix` is assigned before this block, so the cache is attached
      // now that the graph exists (the interceptor reads it live).
      window.netflix.falcorCache = window.netflix_falcor;

      const canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = 360;
      const ctx = canvas.getContext('2d');

      let frame = 0;
      let recorder = null;
      function draw() {
        const gradient = ctx.createLinearGradient(0, 0, 640, 360);
        gradient.addColorStop(0, `hsl(${(frame * 4) % 360}, 80%, 50%)`);
        gradient.addColorStop(1, `hsl(${(frame * 4 + 120) % 360}, 80%, 40%)`);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 640, 360);
        ctx.fillStyle = '#fff';
        ctx.font = '48px sans-serif';
        ctx.fillText(`frame ${frame}`, 40, 200);
        frame += 1;
        if (!recorder || recorder.state === 'recording') requestAnimationFrame(draw);
      }

      const stream = canvas.captureStream(25);
      draw();
      const chunks = [];
      recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      recorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0) chunks.push(event.data);
      };
      recorder.onstop = async () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const video = document.getElementById('player');
        video.src = URL.createObjectURL(blob);
        video.load();
        video.addEventListener('loadedmetadata', async () => {
          window.__kivaraClipDuration = video.duration;
          video.currentTime = 0.05;
          try {
            await video.play();
          } catch {
            window.__kivaraFixtureReady = 'play-rejected';
            return;
          }
          // The subtitle request the player makes: same host shape Netflix
          // uses, with `?o=` so the interceptor's fast path matches.
          try {
            const res = await fetch('https://ipv4-c001.nflxvideo.net/sub/es/seg.xml?o=12345');
            const body = await res.text();
            window.__kivaraTtmlBytes = body.length;
          } catch (err) {
            window.__kivaraTtmlError = String(err);
          }
          window.__kivaraFixtureReady = true;
        });
      };
      recorder.start();
      setTimeout(() => recorder.stop(), 9000);
    </script>
  </body>
</html>
