name: CI

# Unit suite on every push, and the browser suite that loads the built
# extension (the three "manual" checks: keys with sync down, Anki on a custom
# port after an idle service worker, and Quitar across two open tabs).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # Pinned, not `ubuntu-latest`: the fleet has started migrating that label
    # to Ubuntu 26.04, and Playwright 1.60 refuses to install Chromium there
    # ("Playwright does not support chromium on ubuntu26.04-x64"), which killed
    # every e2e job before a single test ran. 24.04 is the supported image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Cheap gate at the front: `.editorconfig` has required LF + a final
      # newline since it was written, and the same four files kept losing the
      # newline anyway because nothing enforced it. `git ls-files --eol`
      # reports i/lf for a multi-line file that is MISSING its final newline —
      # the byte is not part of any line ending — so the check reads the
      # stored blob itself and looks at the last byte. Fails here, in seconds,
      # before the build starts.
      - run: node scripts/check-line-endings.mjs
      - run: pnpm test
      # TWO projects: `app` sees only chrome + vite/client, so a stray
      # `process.env` or a test global in src is now a type ERROR rather than
      # a passing lie; `node` adds the node/vitest globals for scripts and
      # tests. `typecheck` runs both.
      - run: pnpm typecheck

  e2e:
    # Pinned, not `ubuntu-latest`: the fleet has started migrating that label
    # to Ubuntu 26.04, and Playwright 1.60 refuses to install Chromium there
    # ("Playwright does not support chromium on ubuntu26.04-x64"), which killed
    # every e2e job before a single test ran. 24.04 is the supported image.
    runs-on: ubuntu-24.04
    # The manual-verification suite waits for the service worker to be torn
    # down (35s) before asking it for Anki again.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Extensions need a real Chromium from Playwright; xvfb covers any
      # legacy-headless fallback.
      # The browser binary comes from Playwright's own CDN. `--with-deps` only
      # adds the apt package set, and the runner's Ubuntu mirror intermittently
      # fails DNS ("Temporary failure resolving azure.archive.ubuntu.com"),
      # which killed this step with exit 100 before a single test ran — three
      # retries did not help because the mirror stayed unreachable. The
      # ubuntu-latest image already ships Chromium's shared libraries, so the
      # deps pass is best-effort and never fails the job.
      - name: Install Chromium (browser from CDN, apt deps best-effort)
        run: |
          pnpm exec playwright install chromium
          # Bounded: a half-alive mirror spends minutes on "Ign:/Get:" before
          # the job's own timeout kills it (an e2e-audio job died at 15 min
          # still inside apt). 180 s is plenty when the mirror answers.
          timeout 180 pnpm exec playwright install-deps chromium \
            || echo "::warning::install-deps skipped: apt mirror unreachable or slow; runner image already provides the libraries"
      - run: pnpm build
      - run: xvfb-run --auto-servernum -- pnpm exec playwright test

  # The KIVARA_E2E=1 build variant ships the E2E test bridge page
  # (`src/e2e/`) and the AudioWorklet-first defaults. Without this job,
  # `audio-smoke.spec.ts` AND `shipped-capabilities.spec.ts` (which
  # asserts the AudioWorklet default under KIVARA_E2E=1) only ever ran
  # locally. Adds ~90 s to the pipeline.
  e2e-audio:
    # Pinned, not `ubuntu-latest`: the fleet has started migrating that label
    # to Ubuntu 26.04, and Playwright 1.60 refuses to install Chromium there
    # ("Playwright does not support chromium on ubuntu26.04-x64"), which killed
    # every e2e job before a single test ran. 24.04 is the supported image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # See the `e2e` job: the apt mirror is flaky, the Playwright CDN is not.
      - name: Install Chromium (browser from CDN, apt deps best-effort)
        run: |
          pnpm exec playwright install chromium
          # Bounded: a half-alive mirror spends minutes on "Ign:/Get:" before
          # the job's own timeout kills it (an e2e-audio job died at 15 min
          # still inside apt). 180 s is plenty when the mirror answers.
          timeout 180 pnpm exec playwright install-deps chromium \
            || echo "::warning::install-deps skipped: apt mirror unreachable or slow; runner image already provides the libraries"
      # This wrapper does: build with KIVARA_E2E=1, then run the audio
      # workload against that build (scripts/run-e2e-with-flag.mjs).
      - run: xvfb-run --auto-servernum -- pnpm test:e2e:audio

  # The reviewer's specific recommendation: `react-hooks/exhaustive-deps`
  # (?inspect missing deps arrays — the audit round's recurring bug
  # class). Emits WARNINGS but does not fail: shape of deps arrays is a
  # deliberate product risk, not a defect path. Failing CI here would
  # block unrelated work without a fix path.
  lint:
    # Pinned, not `ubuntu-latest`: the fleet has started migrating that label
    # to Ubuntu 26.04, and Playwright 1.60 refuses to install Chromium there
    # ("Playwright does not support chromium on ubuntu26.04-x64"), which killed
    # every e2e job before a single test ran. 24.04 is the supported image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm lint` covers `src/`, `tests/` and `scripts/` (see
      # eslint.config.js). The local `lint` script pins the same
      # `--max-warnings=3` (#39 dropped 21 unused eslint-disable directives
      # from 24; the 3 left are real `react-hooks/exhaustive-deps` hits): the
      # run fails on any NEW warning (or on any error, which already fails),
      # so the trend can only go down. `react-hooks/rules-of-hooks` is an
      # error outright.
      - run: pnpm lint
